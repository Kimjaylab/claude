[project]
name = "korean-daytrading-screener"
version = "0.1.0"
description = "한국 주식 단타 종목 선별 및 텔레그램 알림 시스템"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "websocket-client>=1.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "pyarrow>=15.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
